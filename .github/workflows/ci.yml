name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    name: build (go ${{ matrix.go }})
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Verify formatting
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "These files need gofmt:"; echo "$fmt"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Smoke test (gate trips on CRITICAL)
        run: |
          set +e
          go run ./cmd/ecr-image-scan-gate scan --input examples/findings.json --fail-on high
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 on tripped gate, got $code"; exit 1
          fi
          echo "gate correctly failed the build"
      - name: Smoke test (gate trips on enhanced CRITICAL)
        run: |
          set +e
          go run ./cmd/ecr-image-scan-gate scan --input examples/enhanced-findings.json --fail-on high
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 on tripped gate, got $code"; exit 1
          fi
          echo "gate correctly failed the build on enhanced findings"
