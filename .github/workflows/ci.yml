name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Verify formatting
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "These files need gofmt:"; echo "$fmt"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Smoke test (gate trips on CRITICAL)
        run: |
          set +e
          go run ./cmd/ecr-image-scan-gate scan --input examples/findings.json --fail-on high
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 on tripped gate, got $code"; exit 1
          fi
          echo "gate correctly failed the build"
